<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{meta_description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{meta_description}}">
<meta property="og:url" content="https://drewhoover.com/exercise-mat-lookbook/">
<meta property="og:image" content="https://drewhoover.com/exercise-mat-lookbook/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{meta_description}}">
<meta name="twitter:image" content="https://drewhoover.com/exercise-mat-lookbook/og.png">
<link rel="canonical" href="https://drewhoover.com/exercise-mat-lookbook/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='22' width='52' height='20' rx='3' fill='%2316191c'/%3E%3Cpath d='M23 22v20M41 22v20' stroke='%23eef0f1' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://drewhoover.com/embed/back-bar.js" async></script>
<script src="https://drewhoover.com/embed/giscus.js" async></script>
<style>
:root{--paper:#f0efeb;--card:#fcfbf9;--ink:#191917;--muted:#62615a;--hair:#d8d6cf;--accent:#2f6b45;--warn-bg:#f8e7cf;--warn-ink:#7a4306;--no-ink:#8a2416;--track:#e1dfd8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.masthead{padding:52px 0 20px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.kicker a{color:inherit;text-decoration:none;transition:.15s;border-bottom:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.kicker a:hover{border-bottom-color:currentColor}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(38px,6.4vw,70px);line-height:1;letter-spacing:-.02em;margin:14px 0;max-width:17ch}
.sub{font-size:clamp(17px,2.1vw,20px);max-width:720px;margin:0}
.mono{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0;background:var(--card);border:1.5px solid var(--ink);margin:26px 0 14px}
.pick .ph{background:#fff;display:flex;align-items:center;justify-content:center;padding:14px;min-height:260px}
.pick .ph img{max-height:320px;object-fit:contain}
.pick .pb{padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pick h2{font:800 clamp(26px,3.4vw,36px)/1.08 Fraunces,Georgia,serif;margin:0}
.pick p{margin:0}
.pick .price{font:600 26px "IBM Plex Mono",monospace}
.pick .price small{font-size:13px;color:var(--muted);font-weight:500}
@media(max-width:720px){.pick{grid-template-columns:1fr}.pick .ph{min-height:0}}

.anchor{background:var(--card);border:1.5px solid var(--ink);padding:18px;margin:14px 0}
.anchor p{margin:4px 0 14px;max-width:820px}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:170px 1fr 66px;gap:10px;align-items:center;font-size:14px}
.barrow .lab{font-weight:600}
.barrow .val{font:500 13px "IBM Plex Mono",monospace;text-align:right}
.btrack{height:16px;background:var(--track);position:relative}
.bfill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bfill.top{background:var(--ink)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--no-ink)}
@media(max-width:600px){.barrow{grid-template-columns:1fr 60px;gap:3px 10px}.barrow .lab{grid-column:1/-1;grid-row:1}.barrow .btrack{grid-column:1;grid-row:2}.barrow .val{grid-column:2;grid-row:2}}

.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:14px 0}
.box{background:var(--card);border:1px solid var(--hair);padding:16px 18px}
.box h3{margin:0 0 6px;font:800 20px/1.2 Fraunces,Georgia,serif}
.box p{margin:0}
.legend{font-size:14px;color:var(--muted);max-width:820px;margin:16px 0 0}

section{padding:34px 0 6px}
section>h2{font:800 clamp(26px,3.6vw,38px)/1.1 Fraunces,Georgia,serif;margin:0 0 6px}
.intro{max-width:760px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--hair);display:flex;flex-direction:column;position:relative;min-width:0}
.card.top{border:1.5px solid var(--ink)}
.ribbon{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.05em;padding:3px 8px;z-index:1}
.main{background:#fff;aspect-ratio:4/3;width:100%;object-fit:contain;cursor:zoom-in;padding:8px}
.thumbs{display:flex;gap:6px;padding:6px 12px 0}
.thumbs img{width:48px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--hair);cursor:pointer;padding:0}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{margin:0;font-size:18px;line-height:1.25}
.cb .brand{color:var(--muted);font-size:13px}
.cb .price{font:600 21px "IBM Plex Mono",monospace}
.cb .price s{font-size:13px;color:var(--muted);font-weight:400}
.cb .price small{font-size:12px;color:var(--muted);font-weight:500}
dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:0;font-size:13.5px}
dt{color:var(--muted)}dd{margin:0}
.note{margin:0;font-size:15px}
.flags{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.flags li{background:var(--warn-bg);color:var(--warn-ink);font-size:13px;line-height:1.35;padding:4px 8px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:10px 14px;text-align:center}
.btn:hover{background:var(--accent)}
.cb .btn{margin-top:auto}
.also{font-size:13px;color:var(--muted);text-align:center}
.passed{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.passed li{padding:10px 0;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:4px 18px;font-size:15px}
.passed a{font-weight:600}
@media(max-width:640px){.passed li{grid-template-columns:1fr}}
footer{padding:30px 0 40px;color:var(--muted);font-size:14px}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:50;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;background:#fff}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
  <div class="kicker"><a href="https://github.com/DrewHoo/shopping-lookbook" target="_blank" rel="noopener">A shopping lookbook</a> · <span id="kt"></span></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
</header>
<div id="pick"></div>
<div class="anchor"><div class="mono">Price against Rogue</div><p id="anchorBox"></p><div class="bars" id="bars"></div></div>
<div class="boxes" id="boxes"></div>
<p class="legend" id="legend"></p>
<section id="buy"><h2></h2><p class="intro"></p><div class="grid"></div></section>
<section id="near"><h2></h2><p class="intro"></p><div class="grid"></div></section>
<section id="passed"><h2></h2><p class="intro"></p><ul class="passed"></ul></section>
<footer id="foot"></footer>
<div id="comments"></div>
</div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script>
/*DATA*/
const COPY = /*COPY*/;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const pct = p => Math.round(p / ANCHOR.price * 100);

$('#kt').textContent = COPY.kicker_tail;
$('#h1').textContent = COPY.h1;
$('#sub').textContent = COPY.sub;
$('#anchorBox').textContent = COPY.anchorBox;
$('#legend').textContent = COPY.legend;
$('#foot').textContent = COPY.footer;
$('#boxes').innerHTML = [['box1h','box1'],['box2h','box2']].map(([h,b]) => `<div class="box"><h3>${esc(COPY[h])}</h3><p>${esc(COPY[b])}</p></div>`).join('');

const buy = ITEMS.filter(i => i.sec === 'buy').sort((a,b) => a.rank - b.rank);
const near = ITEMS.filter(i => i.sec === 'near').sort((a,b) => a.rank - b.rank);
const pick = buy[0];
$('#pick').innerHTML = `<div class="pick"><div class="ph"><img src="${pick.imgs[0]}" alt="${esc(pick.brand+' '+pick.name)}"></div><div class="pb">
  <div class="mono">Buy this one</div><h2>${esc(pick.brand)} ${esc(pick.short)}</h2>
  <div class="price">${money(pick.price)} <small>${pct(pick.price)}% of Rogue’s ${money(ANCHOR.price)}</small></div>
  <p>${esc(COPY.pick_why)}</p>
  <a class="btn" href="${pick.url}" target="_blank" rel="noopener">View at ${esc(pick.via)}</a></div></div>`;

const chart = [{short:'Rogue Individual', price:ANCHOR.price, top:true}, ...buy, ...near].sort((a,b) => b.price - a.price);
$('#bars').innerHTML = chart.map(c => `<div class="barrow"><span class="lab">${esc(c.top ? c.short : c.brand.split(' ')[0]+' '+c.short.replace(c.brand.split(' ')[0],'').trim())}</span>
  <div class="btrack"><div class="bfill ${c.top?'top':''}" style="width:${c.price/ANCHOR.price*100}%"></div><div class="tick" style="left:${ANCHOR.target/ANCHOR.price*100}%"></div></div>
  <span class="val">${money(c.price)}</span></div>`).join('');

function card(i, first){
  const size = i.len ? `${i.len}" × ${i.wid}" × ${i.thick}` : `${i.thick} foam, length not listed`;
  const flags = [...(i.miss ? [i.miss] : []), ...(i.flags || [])];
  return `<article class="card ${first?'top':''}" id="c-${i.id}">
   ${first ? '<div class="ribbon">THE PICK</div>' : ''}
   <img class="main" src="${i.imgs[0]}" alt="${esc(i.brand+' '+i.name)}" loading="lazy">
   ${i.imgs.length>1 ? `<div class="thumbs">${i.imgs.map(u=>`<img src="${u}" alt="" loading="lazy">`).join('')}</div>` : ''}
   <div class="cb"><div><div class="brand">${esc(i.brand)}</div><h3>${esc(i.name)}</h3></div>
   <div class="price">${money(i.price)} ${i.wasPrice?`<s>${money(i.wasPrice)}</s> `:''}<small>${pct(i.price)}% of Rogue</small></div>
   <dl><dt>Size</dt><dd>${esc(size)}</dd><dt>Build</dt><dd>${esc(i.body)}</dd><dt>Feel</dt><dd>${esc(i.firmness)}</dd><dt>Storage</dt><dd>${esc(i.storage)}</dd><dt>Weight</dt><dd>${esc(i.weight)}</dd><dt>Rating</dt><dd>${esc(i.rating)}</dd></dl>
   <p class="note">${esc(COPY.notes[i.id])}</p>
   ${flags.length?`<ul class="flags">${flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
   <a class="btn" href="${i.url}" target="_blank" rel="noopener">View at ${esc(i.via)}</a>
   ${i.also?`<a class="also" href="${i.also.url}" target="_blank" rel="noopener">${esc(i.also.label)}</a>`:''}
   </div></article>`;
}
for (const [id, list] of [['buy', buy], ['near', near]]) {
  const s = document.getElementById(id);
  s.querySelector('h2').textContent = COPY.sections[id].title;
  s.querySelector('.intro').textContent = COPY.sections[id].intro;
  s.querySelector('.grid').innerHTML = list.map((i,n) => card(i, id==='buy' && n===0)).join('');
}
const ps = $('#passed');
ps.querySelector('h2').textContent = COPY.sections.passed.title;
ps.querySelector('.intro').textContent = COPY.sections.passed.intro;
ps.querySelector('ul').innerHTML = PASSED.map(([n,w,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a><span>${esc(w)}</span></li>`).join('');

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('.thumbs img')) t.closest('.card').querySelector('.main').src = t.src;
  else if (t.matches('.main')) { $('#lbimg').src = t.src; $('#lb').classList.add('on'); }
  else if (t.closest('#lb')) $('#lb').classList.remove('on');
});
</script>
</body>
</html>
