const COPY = {"title_options": ["Rogue Individual Mat Alternative at Under Half the Price", "Thick Exercise Mat for Kettlebell Workouts, Under $45", "A Thicker Exercise Mat at Under Half of Rogue's Price"], "title": "Rogue Individual Mat Alternative at Under Half the Price", "h1_options": ["Buy the Tri-Fold and set the bell down", "A thicker mat for under half a Rogue", "Rogue's basic build at 47% of the price"], "h1": "Buy the Tri-Fold and set the bell down", "kicker_tail": "one thick mat, under half a Rogue", "sub": "Drew does kettlebell workouts, pushups and lunges on a yoga mat so thin it cushions neither the hands nor the bell, and wants something thicker for about half of what Rogue charges. Buy the ProsourceFit Tri-Fold: $44.99, with the same basic build as Rogue's mat. Width was the optional part of the request, and it's the part this mat gives up.", "meta_description": "The ProsourceFit Tri-Fold: $44.99, Rogue's basic build at 47% of the $95 price. Plus a wider mat with a warning, and what no review says about kettlebells.", "pick_why": "Vinyl over dense closed-cell foam is the basic build of Rogue's $95 mat, and here it costs 47% as much, $2.51 under the half line. Dense foam should let a bell sink less than soft foam does, and 235 reviewers put the mat at 4.9 stars. It's no wider than a yoga mat, which Drew can live with, and it has two fold lines across the surface.", "anchorBox": "The black bar is the Rogue Individual Mat at $95, and the red tick is $47.50, half of that. The Tri-Fold lands just under the tick and the YR just over it, each by about $2.50.", "box1h": "No review mentions a kettlebell", "box1": "None of the reviews we read mention kettlebells, for any mat here, Rogue's included, and we read only a sample of each. Soft foam will let a bell sink more, and a cast-iron bell set down hard can mark foam; that is reasoning, not a test. Mat-seller blogs say foam compresses under bells and favor rubber, but they sell rubber. Set the bell down, and don't drop it.", "box2h": "If width matters more than the bell", "box2": "Take the YR 15mm, which is 11 inches wider than the Tri-Fold for $5 more, and soft where the Tri-Fold is dense. Its own size diagram says \"Exercise equipment not recommend\" beside a crossed-out treadmill. The icon is a treadmill, so that may only mean machines, but it doesn't say kettlebells are fine.", "legend": "The first group is mats at least 10mm thick, at about $50 or less, whose listings we opened in a browser and found no reason to reject. The near misses fail on price or length, and everything else we looked at is at the bottom with the reason. Amazon was not checked, because its page says AI agents aren't allowed, so its prices and listings are not part of this page. Prices as of November 5, 2026; listings change.", "sections": {"buy": {"title": "About $50 or less", "intro": "This list is in order, and a person who doesn't want to shop around can stop after the first card. The YR is there for width, with a warning attached. The Sunny and the Gaiam are cheap, and neither is any wider than a yoga mat."}, "near": {"title": "Near misses", "intro": "The first two are wide and cost too much. The third has the price and, by one buyer's account, not the length."}, "passed": {"title": "Checked and passed on", "intro": "Each of these has its reason next to its name. A rubber stall mat is the tough option at about $50, but it weighs 94 lb against the Tri-Fold's 4.2 and has no give for hands, so it would look after the bell and leave the pushups where they are. Dollamur makes Rogue's mat and sells the same class of mat directly for $104.99, which makes Rogue the cheaper way to get it."}}, "notes": {"yr": "The one to buy if width matters more than the bell, and the soft foam is kind to hands. Its maker's diagram warns off exercise equipment and asks for bare feet, which is why a mat this wide is second.", "trifold": "It gives up the width Drew called optional. The cost is two fold lines, which sit where a pushup or a lunge may land.", "sunny": "Thicker than a thin yoga mat for about a third of Rogue's price, and that is the whole case for it. It adds no width, and the listing doesn't say what kind of foam it is.", "gaiam": "The cheapest way off a thin mat, at about a quarter of Rogue's price. The $20 it saves against the Tri-Fold comes out of thickness and firmness.", "ainfox": "This is the mat for a budget of $70: wide, firm by reviewers' account, and $25 more than the Tri-Fold. It folds in four, so expect more fold lines than the Tri-Fold's two.", "titan": "Closest to the Rogue in build, and priced like it. Saving 15% to get a thinner mat isn't the trade Drew was after.", "rep": "The price is right and shipping is free. One buyer says it's shorter than a yoga mat, though, and lunges run out of mat fast."}, "footer": "No mat here has been tested with a kettlebell, by us or by any review we read."};

const chart = [{short:'Rogue Individual', price:ANCHOR.price, top:true}, ...buy, ...near].sort((a,b) => b.price - a.price);
$('#bars').innerHTML = chart.map(c => `<div class="barrow"><span class="lab">${esc(c.top ? c.short : c.brand.split(' ')[0]+' '+c.short.replace(c.brand.split(' ')[0],'').trim())}</span>
  <div class="btrack"><div class="bfill ${c.top?'top':''}" style="width:${c.price/ANCHOR.price*100}%"></div><div class="tick" style="left:${ANCHOR.target/ANCHOR.price*100}%"></div></div>
  <span class="val">${money(c.price)}</span></div>`).join('');

function card(i, first){
  const size = i.len ? `${i.len}" × ${i.wid}" × ${i.thick}` : `${i.thick} foam, length not listed`;
  const flags = [...(i.miss ? [i.miss] : []), ...(i.flags || [])];
  return `<article class="card ${first?'top':''}" id="c-${i.id}">
   ${first ? '<div class="ribbon">THE PICK</div>' : ''}
   <img class="main" src="${i.imgs[0]}" alt="${esc(i.brand+' '+i.name)}" loading="lazy">
   ${i.imgs.length>1 ? `<div class="thumbs">${i.imgs.map(u=>`<img src="${u}" alt="" loading="lazy">`).join('')}</div>` : ''}
   <div class="cb"><div><div class="brand">${esc(i.brand)}</div><h3>${esc(i.name)}</h3></div>
   <div class="price">${money(i.price)} ${i.wasPrice?`<s>${money(i.wasPrice)}</s> `:''}<small>${pct(i.price)}% of Rogue</small></div>
   <dl><dt>Size</dt><dd>${esc(size)}</dd><dt>Build</dt><dd>${esc(i.body)}</dd><dt>Feel</dt><dd>${esc(i.firmness)}</dd><dt>Storage</dt><dd>${esc(i.storage)}</dd><dt>Weight</dt><dd>${esc(i.weight)}</dd><dt>Rating</dt><dd>${esc(i.rating)}</dd></dl>
   <p class="note">${esc(COPY.notes[i.id])}</p>
   ${flags.length?`<ul class="flags">${flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
   <a class="btn" href="${i.url}" target="_blank" rel="noopener">View at ${esc(i.via)}</a>
   ${i.also?`<a class="also" href="${i.also.url}" target="_blank" rel="noopener">${esc(i.also.label)}</a>`:''}
   </div></article>`;
}
for (const [id, list] of [['buy', buy], ['near', near]]) {
  const s = document.getElementById(id);
  s.querySelector('h2').textContent = COPY.sections[id].title;
  s.querySelector('.intro').textContent = COPY.sections[id].intro;
  s.querySelector('.grid').innerHTML = list.map((i,n) => card(i, id==='buy' && n===0)).join('');
}
const ps = $('#passed');
ps.querySelector('h2').textContent = COPY.sections.passed.title;
ps.querySelector('.intro').textContent = COPY.sections.passed.intro;
ps.querySelector('ul').innerHTML = PASSED.map(([n,w,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a><span>${esc(w)}</span></li>`).join('');

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('.thumbs img')) t.closest('.card').querySelector('.main').src = t.src;
  else if (t.matches('.main')) { $('#lbimg').src = t.src; $('#lb').classList.add('on'); }
  else if (t.closest('#lb')) $('#lb').classList.remove('on');
});
</script>
</body>
</html>
